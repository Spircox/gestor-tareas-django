{% extends 'tareas/base.html' %}
{% block contenido %}
<h1 class="mb-4">{{ titulo }} <small class="text-muted">en {{ proyecto.nombre }}</small></h1>
<div class="card shadow-sm">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary mt-2">Guardar</button>
      <a href="{% url 'tareas:proyecto_detalle' proyecto.pk %}" class="btn btn-secondary mt-2">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
