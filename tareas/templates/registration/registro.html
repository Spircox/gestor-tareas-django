{% extends 'tareas/base.html' %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-3 text-center">Crear cuenta</h3>
        {% if form.errors %}
        <div class="alert alert-danger py-2 small">{{ form.errors }}</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control" value="{{ form.username.value|default:'' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password1" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirma la contraseña</label>
            <input type="password" name="password2" class="form-control" required>
          </div>
          <button class="btn btn-success w-100">Crear cuenta</button>
        </form>
        <p class="mt-3 mb-0 text-center small">¿Ya tienes cuenta? <a href="{% url 'login' %}">Entrar</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
