{% extends 'tareas/base.html' %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-3 text-center">Iniciar sesión</h3>
        {% if form.errors %}
        <div class="alert alert-danger py-2 small">Usuario o contraseña incorrectos.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100">Entrar</button>
        </form>
        <p class="mt-3 mb-0 text-center small">¿Sin cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
